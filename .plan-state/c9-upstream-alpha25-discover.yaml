sqlite_log_risk:
  local_evidence:
    observed_large_files:
      - "~/.vsp-codex/logs_2.sqlite"
      - "~/.vsp-codex/logs_2.sqlite-wal"
    noisy_targets:
      - log
      - codex_otel.log_only
      - codex_otel.trace_safe
  upstream_fix_commits_known:
    - d81fcdf8ef
    - e98d43ac37
    - 91e6da943b
    - 63f8f547c0
  real_validation_contract:
    scenario: "Run VSP Codex with an isolated CODEX_HOME/CODEX_SQLITE_HOME and observe logs_2.sqlite plus logs_2.sqlite-wal growth during a bounded real TUI/app-server smoke."
    pass_signal: "No sustained write amplification from known noisy targets; WAL/database growth remains bounded for the scenario and noisy targets are absent from persisted log rows."
    fail_signal: "Persistent log database or WAL grows continuously at an unbounded rate, or noisy target rows are persisted during the smoke."
    independent_validation_owner: test
    audit_rejects_pseudo_tests: true
