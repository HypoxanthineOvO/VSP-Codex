  visual_markdown_color_followup:
    status: in_progress
    trigger: "User clarified that Markdown syntax support already exists, but bold/italic/list styling is visually too weak; bold rendered as white/default is hard to see."
    requirements:
      - "Markdown emphasis styling must add visible color, not only bold/italic terminal attributes."
      - "Bold, italic, bold+italic, list markers, inline code, links, headings, table borders, and blockquote markers should have theme-consistent visible styles."
      - "Default styling must improve contrast on dark terminals."
      - "Snapshot acceptance should verify styled spans, not only plain text output."
    answers:
      markdown_colored_tokens:
        - "bold"
        - "italic"
        - "bold+italic"
        - "list markers"
        - "headings"
        - "inline code"
        - "links / file paths"
        - "blockquote"
        - "table borders / headers"
      markdown_color_strength: "Subtle but clearly visible."
      markdown_theme_relation: "Theme colors plus a small semantic palette."
    derived_requirements:
      - "Do not leave strong/emphasis styles as default foreground only."
      - "Use color to compensate for terminals where bold/italic attributes are hard to distinguish."
      - "Keep the palette compact and readable for long assistant messages."
    color_mapping_decision:
      markdown_color_roles: "Three-role palette: emphasis text, code/link, and structural elements."
      inline_code_color: "Use a theme-derived code color instead of hardcoded cyan."
      list_table_style: "Color list markers, table headers, and table borders; keep ordinary table/body prose calm."
    acceptance:
      - "Snapshot or style assertions show bold, italic, and bold+italic use visible non-default colors."
      - "Snapshot or style assertions show list markers, table headers, and table borders are colored."
      - "Inline code uses the selected/default theme-derived code style."
  vscode_extension_feasibility:
    status: viable
    evidence:
      - "Official extension installed locally as openai.chatgpt-26.519.32039-linux-x64."
      - "Extension package contributes restricted development setting chatgpt.cliExecutable: path to Codex CLI executable."
      - "Extension bundle starts Codex with arguments: app-server --analytics-default-enabled."
      - "Extension sends initialize with clientInfo and experimentalApi capability over stdio."
      - "Local VSP binary /home/heyx/Codex-VSP/codex-rs/target/debug/vsp-codex app-server --analytics-default-enabled responds successfully to the same initialize shape."
      - "Initialize response reports codexHome=/home/heyx/.vsp-codex and userAgent codex_vscode/0.134.0-vsp.2."
    plan_impact:
      - "VSCode extension support should be treated as a hard preview target, not deferred exploration only."
      - "Likely implementation path is configuration and compatibility work, not writing a full extension from scratch."
      - "Preview release must include an automated or post-install way to point official extension setting chatgpt.cliExecutable at the released vsp-codex binary, with manual fallback if VS Code settings protection blocks automation."
    remaining_unknowns:
      - "Whether all UI flows used by the extension remain compatible with VSP-gated provider/auth behavior."
      - "Whether official extension can show VSP Provider setup cleanly or needs VSP-side app-server compatibility adjustments."
      - "Whether VS Code Settings UI permits normal users to set restricted chatgpt.cliExecutable without extension development friction."
    interface_inventory:
      extension_commands:
        - chatgpt.openSidebar
        - chatgpt.openCommandMenu
        - chatgpt.newCodexPanel
        - chatgpt.addToThread
        - chatgpt.addFileToThread
        - chatgpt.newChat
        - chatgpt.showLspMcpCliArgs
