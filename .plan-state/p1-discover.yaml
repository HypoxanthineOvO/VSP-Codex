  - round: startup_access_speed_3
    topic:
      - startup_and_access_speed
    answers:
      cache_scope:
        - "Session list metadata."
        - "Recent thread preview summaries."
      stale_cache_behavior: "Wait until cache is verified before displaying potentially stale cached data."
      perf_acceptance_signal:
        - "Before/after timing comparison."
        - "Large history fixture test."
        - "No-network or slow-provider startup probe."
        - "VSCode app-server initialize timing."
        - "Loading/cache-refresh state snapshots."
