ask_tool_rounds:
  - round: process_reset
    answers:
      topic_order: "No valid ranking answer captured; defaulting to risk-first order unless user overrides."
      vscode_settings_scope: "Prefer user-level VS Code settings; if that fails, write workspace .vscode/settings.json."
      ask_tool_process: "Each topic gets at least 3 Ask Tool rounds."
    derived_requirements:
      - "All topic-level requirements must be captured through Ask Tool rounds."
      - "VSCode auto-hijack must attempt user settings first, then workspace fallback."
      - "Manual fallback and rollback must be part of release planning."
  - round: vscode_release_1
    topic:
      - vscode_extension_hijack_or_integration
      - preview_release_and_install
    answers:
      release_channel_priority: "GitHub Release binary package first."
      vscode_hijack_behavior:
