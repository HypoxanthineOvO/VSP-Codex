        - "Ctrl+P / Ctrl+Shift+P"
        - "Ctrl+C"
        - "Alt combinations"
      conflict_free_navigation: "Arrow keys move within focused components; Tab / Shift+Tab moves focus between components."
      vscode_terminal_gate: "Documented design constraint plus TUI keymap/snapshot/unit tests; manual VSCode terminal smoke is not a hard release gate."
