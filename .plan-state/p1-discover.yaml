        - "Install official openai.chatgpt extension if missing."
        - "Write chatgpt.localeOverride=zh-CN."
      vscode_acceptance:
        - "Extension initializes through vsp-codex app-server."
        - "User can start one conversation/task from VSCode Sidebar."
        - "VSCode history/list sees VSP session names."
        - "Reasoning is visible or explicitly declared downgraded/unsupported."
        - "VSP Provider setup works without official ChatGPT login dependency."
    derived_requirements:
      - "Release package must include a VSCode integration installer or post-install command."
      - "VSCode compatibility tests must use the official extension and VSP binary, not a mock extension."
  - round: vscode_release_2
    topic:
      - vscode_extension_hijack_or_integration
      - preview_release_and_install
    answers:
      installer_entrypoint: "vsp-codex vscode install subcommand."
      failure_policy: "Failure to auto-install/hijack VSCode is a preview release blocker."
      release_artifacts:
        - "vsp-codex binary"
        - "VSCode automatic integration command/script capability"
        - "quickstart"
        - "rollback script/command"
    derived_requirements:
      - "Implement VSCode installer as first-party CLI subcommand if feasible."
      - "Add rollback path, likely vsp-codex vscode uninstall/reset."
      - "Preview release gate must include VSCode installer smoke."
  - round: vscode_release_3
