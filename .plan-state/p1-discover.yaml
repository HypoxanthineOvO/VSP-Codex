      - "Ctrl+C should retain terminal cancel/interrupt expectations rather than becoming the primary copy command."
      - "Command palette should not rely on Ctrl+Shift+P as its only entry point in the TUI."
      - "Tests should assert keymap/design constraints so forbidden chords are not reintroduced for required actions."
