      - "Release evidence must include timing, large-history behavior, no-network/slow-provider startup, VSCode initialize timing, and visible loading-state coverage."
rounds:
  - round: 1
    questions:
      - "Release bar: preview release vs product-grade stable release?"
      - "Primary user path: TUI, VSCode extension, or both?"
      - "Real acceptance scenarios?"
    user_answers:
      release_bar: "Preview release."
      vscode_scope: "Explore VSCode extension integration/hijack in this Cycle; if viable, make VSCode extension usable after the Cycle."
    derived_requirements:
      - "Treat VSCode as an exploration item with a viability gate, not an unconditional implementation promise."
      - "If VSCode route is viable, include enough work for post-Cycle usage through the extension."
      - "If VSCode route is not viable, produce evidence and a concrete follow-up path."
  - round: 2
    questions:
      - "Is VSCode extension usage a hard preview requirement if viable?"
      - "Which Thinking content should be shown?"
      - "Which entity should true Rename modify?"
    user_answers:
      vscode_requirement: "If it can connect, it must connect in this Cycle; if not, Plan must explicitly determine that."
      thinking_target: "Expose native Reasoning content as thinking events if possible."
      rename_target: "The name seen in resume history, VSCode extension, and other clients; likely session/thread metadata."
    derived_requirements:
      - "Run an immediate VSCode extension feasibility exploration during P1 before P2."
      - "Thinking visibility must investigate whether raw/native reasoning is available and allowed, not merely improve tool/progress display."
      - "Rename should update canonical session/thread metadata rather than a TUI-only alias."
  - round: 3
    questions:
      - "Manual VSCode setting vs automatic settings hijack?"
      - "Acceptable Thinking fallback if raw native reasoning is unavailable?"
      - "Scope of card/rich message UI: TUI only or VSCode too?"
    user_answers:
      vscode_integration_shape: "Prefer automatic VS Code settings write and post-install automatic hijack."
      thinking_fallback: "If raw reasoning is unsupported, summary is acceptable; if neither raw nor summary exists, explicitly do not implement Thinking visibility."
      rich_message_scope: "Prioritize TUI only."
      extension_research_scope: "Scan and study all interfaces supported by the official VSCode extension."
    derived_requirements:
      - "Plan VSCode support as automatic configuration where possible, with manual fallback only if auto hijack is blocked by VS Code/extension constraints."
      - "Thinking implementation must be capability-driven and must not fabricate reasoning content."
      - "Card/rich message work should focus on TUI history cells/messages; VSCode UI patching is out of scope unless required for compatibility."
      - "P1/P2 must include an official extension interface compatibility inventory."
  - round: correction
    trigger: "User noted that many listed topics were not discussed deeply enough and asked why Ask Tools were not used."
    correction:
      - "Treat the first 3 rounds as general discovery plus VSCode feasibility research, not as sufficient topic-level discovery."
      - "Continue P1 with Ask Tool based focused interviews."
      - "Do not enter P2 until every topic has at least 3 Ask Tool rounds or a user-approved deferral."
open_questions:
  - "Which user path must be the release blocker for preview: TUI only, VSCode only, or both?"
  - "Which real acceptance scenarios define preview readiness?"
  - "Can the current VSCode extension route be integrated or hijacked by VSP Codex in this Cycle?"
  - "What exact reasoning event source is available without violating hidden-reasoning/privacy boundaries?"
  - "Which metadata store owns session names across resume history and app-server consumers?"
  - "After scope audit, which items are preview blockers for this Cycle and which should become follow-up Cycle candidates?"
