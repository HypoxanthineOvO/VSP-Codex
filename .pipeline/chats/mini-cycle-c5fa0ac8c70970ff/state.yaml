topic_summary: '<skill> <name>hypo-workflow:plan</name> <path>/home/heyx/Hypo-Workflow/skills/plan/SKILL.md</path> --- name: plan description: Enter Hypo-Workflow planning mode when the user wants to design milestones before execution starts. --- # /hypo-workflow:plan ## 输出语言规则 📌 输出语言规则： 读取 config.yaml → output.language - zh-CN / zh：所有用户可见的输出使用中文（PROGRESS、报告、状态提示、错误消息、交互提问） - en：使用英文 - auto：跟随用户对话语言 内部日志（log.yaml、state.yaml）始终英文。 将此 skill 用于完整的 `Discover -> Technical Stack -> Architecture -> Decompose -> Generate -> Implementation` 规划流程。 普通的 `/hw:plan` 命令保持完整的命名阶段规划流程。如果用户传递 `--deep`，在普通规划之前路由到 `/hw:plan:deep`。`--deep` 别名启动 Deep Plan 讨论包，不得跳过普通 Plan 阶段；在 Deep Plan `convert` 之后，普通的 `/hw:plan` 仍然运行 Configure、Discover、Technical Stack、Architecture、Decompose 和 Generate。 在 Discover 之前，为新 Cycle 运行或确认 `P0 Configure`，除非当前 Cycle 已经有配置决策。`P0 Configure` 在 `cycle new` 之后、Discover 之前运行；它询问自动化、Subagent 授权、验收模式、PR/MR 远程写入确认、完整回归、分析边界和 Worker Separation。用户可以重用先前的设置，按 `cycle_explicit -> previous_cycle_snapshot -> project_config -> global_config -> built_in_default` 顺序解析，重用必须留下可审计的注释或 `.plan-state/p0-configure.yaml`。 没有 `--batch` 时，保留单 Feature 流程。普通的 `/hw:plan` 命令运行一次 Discover 访谈、一次 Technical Stack 检查点、一次 Architecture 检查点、一次 Decompose 检查点和一次 Generate 阶段。确认是阶段内 Question Tool / Ask 门控，不是独立用户命令。 默认情况下启用 Progressive Discover 作为 Discover 的结构。首先从大问题开始： 1. 任务类别 2. 期望效果 3. 验证方法 在 Discover 开始之前，运行或显式重用 Cycle 级别的 `P0 Configure` 前置阶段。`P0 Configure` 在 `cycle new` 之后、Discover 之前运行；它询问自动化、Subagent 授权、验收模式、PR/MR 远程写入策略、完整回归、分析边界和 Worker Separation。重用必须按以下顺序记录其来源：`cycle_explicit`、`previous_cycle_snapshot`、`project_config`、`global_config`、`built_in_default`。 当项目尚未声明 `execution.worker_separation.mode` 时，Discover 还应询问项目是否需要 `off`、`recommended` 或 `strict` 的 implement/test/audit 分离，并在 Generate 期间持久化该决策。 如果为 Worker Separation 选择了降级模式，则需要用户明确确认，并且必须记录非委托理由、缺失角色、降级原因、验证所有者和下游验收影响。 Discover 在 Decompose 之前有一个强制的执行子工作器授权门控。即使项目已声明 `execution.worker_separation.mode=recommended` 或 `strict`，也要应用它。 - Codex：如果没有持久化的授权其范围显式包含 `/hw:start` 和 `/hw:resume` 或 execution/start-resume 角色，询问用户是否授权 `/hw:start` 和 `/hw:resume` 的执行子工作器；如果授权，选择 `recommended` 或 `strict` - Codex：如果用户拒绝执行子工作器，要么阻止 start/resume 直到获得授权，要么显式确认最快的单代理通道，持久化为 `execution.worker_separation.mode=off` - Claude Code：配置的子工作器不需要额外的授权门控；询问执行子工作器应该使用 `subcodex` 还是 `subclaude`，然后选择 `recommended` 或 `strict` - OpenCode：配置的原生代理/子代理不需要额外的授权门控；选择 `recommended` 或 `strict`，或显式 `off` 该模式仍然管理 implement/test/audit 分离：`recommended` 在可能时分离 implement 和 test，而 `strict` 要求 implement/test/audit 是不同的。 仅限 Codex：不要将缺失授权视为 `recommended`，也不...[truncated]'
