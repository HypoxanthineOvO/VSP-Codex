  assistant: 你这个判断是对的。`0.140.0-vsp.0` 是版本策略错误。 我刚核了本地/远端 tag，历史是： `v0.134.0-vsp.1` → ... → `v0.134.0-vsp.7` → `v0.134.0-vsp.7.1` → `v0.134.0-vsp.7.2` → 错误的 `v0.140.0-vsp.0` 正确规则应是： - upstream baseline 变了：前面的 upstream 版本号变，比如 `0.134.0` → `0.140.0` - VSP 自己的序列不重置 - 只是换 upstream baseline、不加 VSP 功能：保持当前 VSP 线 - 有新的 VSP 功能/行为修复：VSP 序列继续递增 所以这批后续修复不应该发布成 `0.140.0-vsp.0` 或 `0.140.0-vsp.1`。更合理的下一版是： `0.140.0-vsp.8` 原因是 `vsp.7.x` 已经存在，后面这些 Question Tool、VSCode 插件、TUI 链接、CI/docs discipline 都是 VSP 自己的行为修复/功能面，不只是单纯换 upstream baseline。 我建议处理方式： - 不重写已经存在的 `v0.140.0-vsp.0` tag/release，避免破坏已发布引用。 - 把它视为错误命名的已发布历史版本。 - 下一次正式发布改为 `v0.140.0-vsp.8`。 - 更新 `codex-rs/Cargo.toml`、docs、release manifest、release notes、安装命令、包目录和 GitLab Release asset 到 `0.140.0-vsp.8`。 - release notes 里注明：`v0.140.0-vsp.0` 被 `v0.140.0-vsp.8` supersede，因为 VSP suffix policy 修正为跨 upstream baseline 延续编号。
