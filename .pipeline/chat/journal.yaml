  user: 这些都做了推送和 Release 吗？sync doc release 管线现在如何？版本号怎么确定？
  assistant: '没有全部做。准确状态是： **已推送/已 Release 的部分** 远端 `origin/main` 和 `origin/c9-upstream-0.140.0-alpha.18` 当前都在： `6c1706ab7d workflow(C9): record TUI link hotfix release` GitLab Release/tag 已存在： `v0.140.0-vsp.0` 当前远端 release manifest 仍指向 6 月 19 日那版资产： `sha256 = 6a2e618cf1462261dcc49ca00462e1b56ecf6862d41779a4ac0c71c0f93c3d16` 也就是说，已经正式发布的是到 **TUI link hotfix 旧版** 为止。 **还没推送/没 Release 的部分** 后面这些目前是本地工作区改动和本机二进制部署，没有 commit/push，也没有刷新 GitLab Release asset： - Question Tool 前置 `Question Context / Answer impact` 合成消息移除 - VSCode/plugin Question Tool fallback 进一步修正 - TUI 文件链接最终策略：抑制 VSCode terminal 里的 `file://` OSC8，而不是改写成 `vscode-remote://` - CI docs discipline：`docs/ci.md`、`scripts/check_ci_docs.py`、`.gitlab-ci.yml` 里的本地改动 - 对应 `.pipeline/debug/*` 新报告 本机 `~/.vsp-codex/packages/standalone/current/bin/vsp-codex` 已部署到最新本地 build，SHA 是： `2e4ca430aac7dd5c258845ec0b0daa7486d74532a50c70554870f92ab91a3cfc` 但这个 **不是 GitLab Release 资产**。 **sync / doc / release 管线现状** 本地草案现在是： - CI：`.gitlab-ci.yml` 有 `format`、`tui-regression`、`tui-user-simulation`。 - 本地新增了 `scripts/check_ci_docs.py`，并让 `format` job 跑它。 - `docs/ci.md` 描述规则：测试变更要同步更新 CI，不把 CI 修复留到事后。 - Release 仍是手动流程：本地 build -> `scripts/build_vsp_preview_release.py` -> 更新 manifest/release notes -> commit/push -> 等 CI -> 替换 GitLab Release asset -> 验证远端下载 SHA。 但这些 CI/doc 管线改动目前还没推上远端，所以远端 pipeline 还不是最终状态。 **版本号怎么确定** 当前运行版本来自 [codex-rs/Cargo.toml](/home/heyx/Codex-VSP/codex-rs/Cargo.toml:128)： `0.140.0-vsp.0` 规则上是：upstream 基线是 `rust-v0.140.0-alpha.18`，VSP 对应第一版用 `0.140.0-vsp.0`，Git tag 加 `v` 前缀，即 `v0.140.0-vsp.0`。 如果继续“同版本 hotfix”策略，可以仍然刷新 `v0.140.0-vsp.0` 的 Release asset；但这次已经有多轮行为修正和文档/CI 管线变化，我更建议下一次正式发布用 `0.140.0-vsp.1`，避免用户和安装器分不清同版本下到底是哪一版二进制。'
