      - "GitHub latest release currently points to 0.140.0-alpha.18."
      - "Alpha target may include breaking changes and requires heavier validation."
  worktree_strategy:
    recommendation: "Before merge execution, commit/checkpoint current archive/planning changes, then create a dedicated upgrade branch."
    rationale:
      - "Current worktree is dirty from archive maintenance, planning state, and existing unrelated local changes."
      - "A baseline upgrade needs a clean diff boundary for conflict review."
  merge_strategy:
    recommendation: "Fetch upstream, compare current VSP divergence, merge or rebase onto selected upstream tag in an isolated branch, preserve VSP-specific CLI/config/provider/release behavior, then run focused and broad Rust validation."
