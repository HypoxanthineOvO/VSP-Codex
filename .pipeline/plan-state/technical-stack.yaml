      - "cargo fmt --manifest-path codex-rs/Cargo.toml --check"
      - "cargo test --manifest-path codex-rs/Cargo.toml --workspace"
      - "cargo build --manifest-path codex-rs/Cargo.toml --release --bin vsp-codex"
