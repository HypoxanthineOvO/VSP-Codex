  summary: '<skill> <name>hypo-workflow:cycle</name> <path>/home/heyx/Hypo-Workflow/skills/cycle/SKILL.md</path> --- name: cycle description: Manage Hypo-Workflow Cycles with independent milestone sequences, state, progress, reports, archives, and summaries. --- # /hypo-workflow:cycle ## 输出语言规则 📌 输出语言规则： 读取 config.yaml → output.language - zh-CN / zh：所有用户可见的输出使用中文（PROGRESS、报告、状态提示、错误消息、交互提问） - en：使用英文 - auto：跟随用户对话语言 内部日志（log.yaml、state.yaml）始终英文。 当用户调用 `/hw:cycle` 或 `/hypo-workflow:cycle` 时使用此技能。 Cycle 是项目级交付容器。每个 Cycle 拥有自己的 Milestone 序列、`.pipeline/state.yaml`、`.pipeline/PROGRESS.md`、`.pipeline/prompts/` 和 `.pipeline/reports/`。Milestone 编号在每个 Cycle 内从 `M0` 重新开始。跨 Cycle 文件保持原位。 ## 路径 所有路径相对于 `.pipeline/`，除非明确指定项目根路径： - 活跃 Cycle：`.pipeline/cycle.yaml` - 归档：`.pipeline/archives/C{N}-{slug}/` - Patch：`.pipeline/patches/` - 项目摘要：项目根目录 `PROJECT-SUMMARY.md` - 持久文件：`.pipeline/architecture.md`、`.pipeline/config.yaml`、`.pipeline/log.yaml`、`.pipeline/patches/` - 持久知识：`.pipeline/knowledge/` ## 指令列表 支持的格式： - `/hw:cycle new "名称" [--type feature|bugfix|refactor|spike|hotfix] [--context audit,patches,deferred,debug]` - `/hw:cycle list` - `/hw:cycle view C{N}` 或 `/hw:cycle view 0` - `/hw:cycle close [--reason "..."] [--paused]` - `/hw:accept` - `/hw:reject "<反馈>"` ## Cycle 文件 创建 `.pipeline/cycle.yaml`，格式如下： ```yaml cycle: number: 1 name: "初始开发" type: feature status: active started: "2026-04-28T12:00:00+08:00" preset: tdd context_sources: [] previous_cycle: null summary: null lessons: null ``` 使用带时区的 ISO-8601 时间戳。从 `output.timezone` 解析时区；默认为 `Asia/Shanghai`。 ## 类型与 Preset 映射 - `feature` -> `tdd` - `refactor` -> `tdd` - `bugfix` -> `implement-only` - `spike` -> `implement-only` - `hotfix` -> `implement-only` 用户可以编辑 `.pipeline/cycle.yaml` 来覆盖 `cycle.preset`。除非用户明确要求，否则不要覆盖用户的设置。 ## `/hw:cycle new` 1. 读取 `.pipeline/config.yaml` 和可选的 `~/.hypo-workflow/config.yaml`。 2. 如果 `.pipeline/cycle.yaml` 存在且 `cycle.status=active`，在创建新 Cycle 前先运行此技能的归档流程。 3. 通过扫描确定下一个编号： - 现有的活跃 `.pipeline/cycle.yaml` - `.pipeline/archives/C*/cycle.yaml` - 匹配 `C{N}-*` 的归档目录名称 4. 如果没有 Cycle 文件存在，将第一个显式 Cycle 创建为 `C1`。 5. 需要时将名称转换为 slug 格式用于归档路径。 6. 解析 `--type`；如果省略则默认为 `feature`。 7. 解析 `--context`；将支持的值存储在 `cycle.context_sources` 中。 8. 创建 `.pipeline/cycle.yaml`。 9. 重置 Cycle 本地运行时： - 从共享根资产 `../../assets/state-init.yaml` 重置 `.pipeline/state.yaml` - 删除 `.pipeline/prompts/` 下的文件 - 删除 `.pipeline/reports/` 下的文件 - 如果 `.pipeline/PROGRESS.md` 属于前一个 Cycle，则删除它 10. 保留： - `.pipeline/architecture.md` - `.pipeline/config.yaml` - `.pipeline/log.yaml` - `.pipeline/patches/` - `.pipeline/archives/` 11. 报告新 Cycle 的编号、名称、类型、Preset 和上下文源。 兼容性：没有 `.pipeline/cycle.yaml` 的项目仅在显示和迁移上下文中被视为隐式 `C1`。`/hw:init` 不得创建 `.pipeline/cycle.yaml`。 ## `/hw:cycle close` 关闭活跃 Cycle 并归档其本地产物。 Cycle 0 Legacy 根据定义已经关闭。如果用户要求关闭 Cycle 0，停止并报告 Legacy 历史不能再次关闭。 状态规则： - 无标志 -> `completed` - `--reason "..."` -> `abandoned` 并将原因记录为 `cycle.lessons` - `--paused` -> `paused` - 手动验收模式 -> `pending_acceptance` 直到 `/hw:accept` 或 `/hw:reje...[truncated]'
