          answer: "可以使用本地 focused tests、TUI snapshots 和 schema fixtures 作为主要实现验证，但最终验收通过前必须由用户真实换电脑测试 resume。"
        - id: P1-Q002
          answer: "同意按建议拆成约 7 个 milestone。"
        - id: P1-Q003
          answer: "native Ask capability 字段名没有特别意见，留给实现阶段按代码风格命名。"
    - round: 2
      answered_at: "2026-05-26T18:10:00+08:00"
      questions:
        - id: P1-Q004
          answer: "不需要每 turn/问题数硬限制。Ask 不是只给 Workflow Plan 用，Confirm Gate、验收和普通合适时机都可以用。期望形态是问题 + 简述 + 回答模块，模型能写足够信息帮助用户回答。"
        - id: P1-Q005
