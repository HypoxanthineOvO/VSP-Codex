  source_context:
    - ".pipeline/deep-plans/DP001-ask-user-tools/plan-context.md"
    - ".pipeline/config.yaml"
    - ".pipeline/cycle.yaml"
  workflow_kind: build
  interaction:
    mode: interactive
    minimum_rounds: 3
    completed_rounds: 3
    exit_signal_received: true
    exit_signal: "用户明确要求：进入 P2。"
  p0_configure_ref: ".pipeline/plan-state/p0-configure.yaml"
  discovered:
    task_category: "Rust Codex-VSP feature work touching protocol, core, app-server, and TUI."
    expected_effect:
      - "Ask User Tools become a structured, recoverable, cross-client interaction primitive."
      - "Plan/SubPlan becomes a persistent structured TUI panel instead of history-only plan cells."
    validation_method:
      status: partially_confirmed
      draft:
        - "Run app-server protocol schema generation/tests when v2 payload changes."
        - "Run focused core tests for request_user_input and plan state behavior."
        - "Run codex-tui tests and insta snapshot review for visible TUI changes."
      user_confirmed:
        - "Local focused tests, TUI snapshots, and schema fixtures are acceptable implementation validation."
        - "Final C3 acceptance cannot pass until the user performs a real cross-device resume test."
      acceptance_gate:
        manual_cross_device_resume_required: true
        owner: user
        note: "The implementation can be code/test complete before this, but Cycle acceptance remains blocked until the user actually switches computers and verifies pending Ask resume behavior."
    milestone_granularity:
      status: confirmed
      selected: "approximately 7 milestones as proposed in plan-context.md"
    native_ask_capability:
      status: deferred_to_implementation
      note: "User has no preferred field name; implementation should choose a repo-consistent experimental capability name."
    ask_usage_policy:
      status: confirmed
      hard_per_turn_limit: false
      summary: "Ask is a general collaboration primitive, not only a Workflow Plan tool. It must support confirmations, gates, acceptance, and ordinary moments where asking is appropriate."
      desired_shape: "A question plus a short explanatory summary plus an answer module, with enough context for the user to answer well."
    final_acceptance:
      status: confirmed
      cross_device_resume_required_in_cycle: true
      failure_policy: "If real cross-device resume fails, C3 cannot be accepted; extend milestones inside this Cycle and fix it."
    plan_panel_interaction:
      status: confirmed
      default_idle_collapsed: true
      manual_expand_shortcut_required: true
      note: "Default idle can collapse to a one-line summary, but the user must have a shortcut to expand and inspect details."
    ask_description_model:
      status: confirmed
      request_summary_required: true
      per_question_description_supported: true
      note: "Ask should support both a request-level summary and optional per-question explanatory text."
    plan_app_server_exposure:
      status: confirmed
      expose_structured_plan_state_in_v2: true
      note: "Plan/SubPlan state must be available to future VSCode/GUI clients through app-server v2, not only rendered inside the TUI."
  worker_separation_gate:
    status: satisfied
    source: ".pipeline/config.yaml"
    mode: strict
    codex_execution_subworkers_authorized: true
    authorized_scopes:
      - /hw:start
      - /hw:resume
  rounds:
    - round: 1
      answered_at: "2026-05-26T18:05:00+08:00"
      questions:
