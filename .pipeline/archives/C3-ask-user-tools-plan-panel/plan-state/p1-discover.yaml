      questions:
        - id: P1-Q005
          answer: "Default idle 折叠态可以提供快捷键展开。"
        - id: P1-Q007
          answer: "Ask 的 request 总说明和每个 question 自己的说明都要支持。"
        - id: P1-Q008
          answer: "Plan/SubPlan 常驻状态也要通过 app-server v2 暴露给未来 VSCode/GUI。"
  open_questions:
    - id: P1-Q001
      question: "真实验收验证的优先级和边界是否接受使用本地 focused tests + TUI snapshots + schema fixtures，而不是要求人工跨设备实测？"
      status: answered
    - id: P1-Q002
      question: "C3 的 execution granularity 是否按建议拆成 7 个 milestone，还是希望更少的粗粒度 milestone？"
      status: answered
    - id: P1-Q003
      question: "app-server native Ask capability 的设计是否可以由实现阶段命名，还是需要现在指定字段名？"
      status: answered
    - id: P1-Q004
      question: "Ask Tools 的模型使用边界是否要加硬性限制，例如每 turn 最多一次 Ask 或每次最多 5 个问题？"
      status: answered
    - id: P1-Q005
      question: "Plan/SubPlan 面板的 Default idle 折叠态是否需要可手动展开，还是只在非 idle 自动展开？"
      status: answered
    - id: P1-Q006
      question: "真实换电脑验收失败时，C3 是整体 reject 回修，还是允许先接受非 resume 部分并开后续 Cycle 修复？"
      status: answered
    - id: P1-Q007
      question: "Ask 的“简述”应该是每个 Ask request 一个总说明，还是每个 question 都可以带自己的说明？"
      status: answered
    - id: P1-Q008
      question: "Plan/SubPlan 面板是否也要通过 app-server 暴露给未来 VSCode/GUI，还是 C3 先只做 TUI 常驻面板？"
      status: answered
