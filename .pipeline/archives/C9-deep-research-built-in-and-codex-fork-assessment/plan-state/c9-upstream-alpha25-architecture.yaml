summary: "Architecture checkpoint for an incremental conflict-group merge toward upstream rust-v0.143.0-alpha.25 while preserving or replacing VSP surfaces by equivalence."
baseline:
  pipeline_architecture_available: false
  note: ".pipeline/architecture.md was not readable during the checkpoint; this architecture proposal should become the temporary baseline for Decompose and can later be promoted into .pipeline/architecture.md after confirmation."
